<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CadGC</title>
    <link rel="icon" href="CadGCicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --fundo-principal: #f5f5f5;
            --texto: #222222;
            --texto-inverso: #ffffff;
            --destaque: #0077ff;
            --destaque-inverso: #66bbff;
            --fundo-card: #ffffff;
        }

        html, body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            line-height: 1.5em;
            background-color: var(--fundo-principal);
            color: var(--texto);
        }

        header{
            position: sticky;
            background-color: var(--destaque);
            padding: 30px;
            display: flex;
            flex-flow: column nowrap;
            border-radius: 0 0 15px 15px;
        }

        header div{
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        span.dot{
            width: 15px;
            height: 15px;
            border-radius: 2px;
            background: var(--texto-inverso); 
            transform: rotate(45deg);
        }

        h1.titulo{
            color: var(--texto-inverso);
            font-size: 60px;
            font-weight: bold;
        }

        p.texto{
            color: var(--texto-inverso);
            font-size: 18px;
        }

        main{
            display: grid;
            grid-template-columns: 1fr 90% 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        section {
            grid-column: 2;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
        }

        legend{
            display: flex;
            justify-content: center;
            color: var(--destaque);
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        main section div{
            background-color: var(--fundo-card);
            display: flex;
            flex-flow: column nowrap;
            padding: 25px;
            border-radius: 15px;
            gap: 10px;
        }

        .botao{
            background-color: var(--destaque);
            color: var(--texto-inverso);
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .botao:hover{
            box-shadow: inset 0 -8px 12px -10px var(--texto);
        }

        .campo{
            padding: 10px;
            margin-bottom: 20px;
            background-color: var(--fundo-principal);
            color: var(--texto);
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            appearance: none;
            -webkit-appearance: none;
        }

        input.campo:focus {
            outline: none;
            border: 2px solid var(--destaque);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
    <div>
        <span class="dot"></span><h1 class="titulo">CadGC</h1>
    </div>
    <div>
        <p class="texto">O formulário on-line oficial da Igreja PIB Castelo para líderes e liderados de GC</p>
    </div>
    </header>
    <main>
        <section>
            <form action="#" method="get">
                <fildset>
                    <legend>Entre com seus dados</legend>
            
                    <div>
                        
                        <label for="Nome">Nome</label>
                        <input class="campo" type="text" id="Nome" required autofocus placeholder="Seu nome e sobrenome">
                        
                        <label for="CPF">CPF</label>
                        <input class="campo"  type="text" id="CPF" inputmode="numeric" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" placeholder="000.000.000-00">

                        <label for="Nasc">Data de Nascimento</label>
                        <input class="campo"  type="date" id="Nasc" required>
                
                        <p>Pertence a algum GC?</p>

                        <label>
                        <input type="radio" name="gc" value="Sim" required>
                            Sim
                        </label>

                        <label>
                        <input type="radio" name="gc" value="Não" required>
                            Não
                        </label>
                
                        <label for="GC">Qual é o seu GC?</label>
                        <input class="campo" type="text" id="GC" required>
                
                        <p>É membro da PIB Castelo?</p>

                        <label>
                        <input type="radio" name="member" value="Sim" required>
                            Sim
                        </label>

                        <label>
                        <input type="radio" name="member" value="Não" required>
                            Não
                        </label>

                        <p>É Batizado?</p>

                        <label>
                        <input type="radio" name="batiz" value="Sim" required>
                            Sim
                        </label>

                        <label>
                        <input type="radio" name="batiz" value="Não" required>
                            Não
                        </label>
                
                        <label for="fone">Informe seu telefone para contato</label>
                        <input class="campo" type="tel" id="fone" required placeholder="(31) 99999-9999" maxlength="15">

                        <input class="botao" type="submit" value="Finalizar Cadastro">
                    </div>
                </fildset>
            </form>
        </section>
    </main>
    <script>

    </script>
</body>
</html>
